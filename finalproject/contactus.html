<body>
    <header>
        <img src="images/logo.png" class="logo" alt="logo" width="34" height="34">
        <span>Consciencia Holistica</span>
        <button id="dark" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
        <button id="hamburger" class="hamburger" aria-label="Toggle navigation menu"></button>

    </header>
    <nav id="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About Us</a></li>
            <li><a href="services.html">Services</a></li>
            <li class="active"><a href="contactus.html">Contact Us</a></li>
        </ul>
    </nav>
    <main>
        <img src="images/medstones.webp" alt="Medstones Image" class="hero" width="1200" height="400" loading="eager"
            fetchpriority="high">
        <h1>Schedule an Appointment</h1>

        <form method="get" action="confirm.html">
            <label>First Name <input type="text" name="first" required autocomplete="given-name"
                    title="First Name"></label>
            <label>Last Name <input type="text" name="last" required autocomplete="family-name"
                    title="Your Last Name"></label>
            <label>Cell Phone <input type="tel" name="phone" autocomplete="tel" title="A Phone Number with dashes"
                    placeholder="510-777-1234" required></label>
            <label>Appointment Date <input type="date" name="date" required></label>

            <input type="submit" value="Schedule an Appointment">
        </form>
    </main>
    <footer>
